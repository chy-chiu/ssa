name: price
study: price
variant: wq_0_3
seed: 123
steps: 100
n_replicates: 1
market:
  market_limit: 3
  market_pref_limit: 5
  agent_pref_limit: 5
  history_limit: 10
  skill_phi: 0.1
  rep_window: 5
  rep_lambda: 0.5
  rep_sensitivity: 1
  gumbel_t: 0.01
tasks:
  - { type: ProxyTask, id: SK-A, params: { noise: 0.05 } }
  - { type: ProxyTask, id: SK-B, params: { noise: 0.05 } }
jobs:
  - { id: JB-A0, task_id: SK-A, job_p: 0.8, noise: 0.0, w_q: 0.3, base_reward: 10 }
  - { id: JB-A1, task_id: SK-A, job_p: 0.8, noise: 0.0, w_q: 0.3, base_reward: 7 }
  - { id: JB-A2, task_id: SK-A, job_p: 0.8, noise: 0.0, w_q: 0.3, base_reward: 4 }
  - { id: JB-B0, task_id: SK-B, job_p: 0.8, noise: 0.0, w_q: 0.3, base_reward: 10 }
  - { id: JB-B1, task_id: SK-B, job_p: 0.8, noise: 0.0, w_q: 0.3, base_reward: 7 }
  - { id: JB-B2, task_id: SK-B, job_p: 0.8, noise: 0.0, w_q: 0.3, base_reward: 4 }
agents:
  - type: ReActAgent
    id_template: L2M-{i}
    count: 2
    verbose: false
    model: { type: OpenAIClient, params: { effort: none } }
  - type: SSAAgent
    id_template: SSA-{i}
    count: 2
    verbose: false
    model: { type: OpenAIClient, params: { effort: none } }
