seed: 123
runs:
  - name: ssa_scaffold_50_2
    study: rebuttal
    variant: ssa_scaffold_50_2
    steps: 50
    n_replicates: 20
    replicate_start: 0
    market:
      market_limit: 3
      market_pref_limit: 5
      agent_pref_limit: 5
      history_limit: 10
      skill_phi: 0.1
      rep_window: 5
      rep_lambda: 0.5
      rep_sensitivity: 1
      gumbel_t: 0.01
    tasks:
      - { type: ProxyTask, id: SK-A, params: { noise: 0.05 } }
      - { type: ProxyTask, id: SK-B, params: { noise: 0.05 } }
      - { type: ProxyTask, id: SK-C, params: { noise: 0.05 } }
      - { type: ProxyTask, id: SK-D, params: { noise: 0.05 } }
      - { type: ProxyTask, id: SK-E, params: { noise: 0.05 } }
    jobs:
      - { id: JB-A0, task_id: SK-A, job_p: 0.8, noise: 0.5, base_reward: 10 }
      - { id: JB-A1, task_id: SK-A, job_p: 0.8, noise: 0.5, base_reward: 8 }
      - { id: JB-A2, task_id: SK-A, job_p: 0.8, noise: 0.5, base_reward: 6 }
      - { id: JB-A3, task_id: SK-A, job_p: 0.8, noise: 0.5, base_reward: 4 }
      - { id: JB-B0, task_id: SK-B, job_p: 0.8, noise: 0.5, base_reward: 10 }
      - { id: JB-B1, task_id: SK-B, job_p: 0.8, noise: 0.5, base_reward: 8 }
      - { id: JB-B2, task_id: SK-B, job_p: 0.8, noise: 0.5, base_reward: 6 }
      - { id: JB-B3, task_id: SK-B, job_p: 0.8, noise: 0.5, base_reward: 4 }
      - { id: JB-C0, task_id: SK-C, job_p: 0.8, noise: 0.5, base_reward: 10 }
      - { id: JB-C1, task_id: SK-C, job_p: 0.8, noise: 0.5, base_reward: 8 }
      - { id: JB-C2, task_id: SK-C, job_p: 0.8, noise: 0.5, base_reward: 6 }
      - { id: JB-C3, task_id: SK-C, job_p: 0.8, noise: 0.5, base_reward: 4 }
      - { id: JB-D0, task_id: SK-D, job_p: 0.8, noise: 0.5, base_reward: 10 }
      - { id: JB-D1, task_id: SK-D, job_p: 0.8, noise: 0.5, base_reward: 8 }
      - { id: JB-D2, task_id: SK-D, job_p: 0.8, noise: 0.5, base_reward: 6 }
      - { id: JB-D3, task_id: SK-D, job_p: 0.8, noise: 0.5, base_reward: 4 }
      - { id: JB-E0, task_id: SK-E, job_p: 0.8, noise: 0.5, base_reward: 10 }
      - { id: JB-E1, task_id: SK-E, job_p: 0.8, noise: 0.5, base_reward: 8 }
      - { id: JB-E2, task_id: SK-E, job_p: 0.8, noise: 0.5, base_reward: 6 }
      - { id: JB-E3, task_id: SK-E, job_p: 0.8, noise: 0.5, base_reward: 4 }
    agents:
      - type: ConfigAgent
        id_template: SSAD-{i}
        count: 4
        params: { agent_type: ssa_default }
        verbose: false
        model: { type: OpenAIClient, params: { effort: none } }
      - type: ConfigAgent
        id_template: SSAK-{i}
        count: 4
        params: { agent_type: ssa_knowledge }
        verbose: false
        model: { type: OpenAIClient, params: { effort: none } }
      - type: ConfigAgent
        id_template: SSAS-{i}
        count: 4
        params: { agent_type: ssa_structure }
        verbose: false
        model: { type: OpenAIClient, params: { effort: none } }
      # - type: ConfigAgent
      #   id_template: CON-1{i}
      #   count: 2
      #   params: { agent_type: config_1a }
      #   verbose: false
      #   model: { type: OpenAIClient, params: { effort: none } }
      # - type: ConfigAgent
      #   id_template: CON-2{i}
      #   count: 2
      #   params: { agent_type: config_1b }
      #   verbose: false
      #   model: { type: OpenAIClient, params: { effort: none } }
      # - type: ConfigAgent
      #   id_template: CON-3{i}
      #   count: 2
      #   params: { agent_type: config_2a }
      #   verbose: false
      #   model: { type: OpenAIClient, params: { effort: none } }
      # - type: ConfigAgent
      #   id_template: CON-4{i}
      #   count: 2
      #   params: { agent_type: config_2b }
      #   verbose: false
      #   model: { type: OpenAIClient, params: { effort: none } }
      # - type: ReActAgent
      #   id_template: REA-{i}
      #   count: 4
      #   verbose: false
      #   model: { type: OpenAIClient, params: { effort: none } }
      - type: CoTAgent
        id_template: COT-{i}
        count: 4
        verbose: false
        model: { type: OpenAIClient, params: { effort: none } }
      - type: PolicyAgent
        ids: [POL-1]
        verbose: false
        policy: { greedy: true, underbid_factor: 0.8, train_p: 0.1 }
      - type: PolicyAgent
        ids: [POL-2]
        verbose: false
        policy:
          greedy: false
          underbid_factor: 0.9
          task_preferences: [SK-A]
          job_preferences: [JB-A0, JB-A1, JB-A2, JB-A3]
          train_p: 0.2
      - type: PolicyAgent
        ids: [POL-3]
        verbose: false
        policy:
          greedy: false
          underbid_factor: 0.9
          task_preferences: [SK-B]
          job_preferences: [JB-B0, JB-B1, JB-B2, JB-B3]
          train_p: 0.2
      - type: PolicyAgent
        ids: [POL-4]
        verbose: false
        policy:
          greedy: false
          underbid_factor: 0.9
          task_preferences: [SK-C]
          job_preferences: [JB-C0, JB-C1, JB-C2, JB-C3]
          train_p: 0.2
      - type: PolicyAgent
        ids: [POL-5]
        verbose: false
        policy:
          greedy: false
          underbid_factor: 0.9
          task_preferences: [SK-D]
          job_preferences: [JB-D0, JB-D1, JB-D2, JB-D3]
          train_p: 0.2
      - type: PolicyAgent
        ids: [POL-6]
        verbose: false
        policy:
          greedy: false
          underbid_factor: 0.9
          task_preferences: [SK-E]
          job_preferences: [JB-E0, JB-E1, JB-E2, JB-E3]
          train_p: 0.2
